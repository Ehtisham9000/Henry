name: Build Stack Tac Toe APK
on:
  push:
    branches: [aurelis-apk-build]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: aurelis
        run: gradle assembleDebug --no-daemon
      - name: Verify APK exists
        run: test -s aurelis/app/build/outputs/apk/debug/app-debug.apk
      - name: Emit APK payload
        if: github.event_name == 'push'
        run: |
          echo "APK_BASE64_BEGIN"
          base64 -w76 aurelis/app/build/outputs/apk/debug/app-debug.apk
          echo "APK_BASE64_END"
