name: Build Stack Tac Toe APK
on:
  push:
    branches: [aurelis-apk-build]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: aurelis
        run: gradle assembleDebug --no-daemon
      - name: Verify APK exists
        run: test -s aurelis/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="stack-tac-toe-v1.0-${GITHUB_SHA::7}"
          gh release create "$tag" aurelis/app/build/outputs/apk/debug/app-debug.apk --title "Stack Tac Toe v1.0" --notes "Playable Android prototype generated from the Stack Tac Toe concept."
